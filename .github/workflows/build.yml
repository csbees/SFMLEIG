name: Build Asteroids

on:
  push:
    branches: [ SFX_thing ]

  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            name: Linux

          - os: windows-latest
            name: Windows

          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libfreetype-dev \
            libflac-dev \
            libvorbis-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libharfbuzz-dev \
            libmbedtls-dev \
            libssh2-1-dev

      - name: Configure CMake
        run: >
          cmake
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPRODUCTION_BUILD=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p package

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp -R build/bin/Asteroids.app package/
            cp -R Assets package/

          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cp build/bin/Release/Asteroids.exe package/
            cp -R Assets package/

          else
            cp build/bin/Asteroids package/
            cp -R Assets package/
          fi

      - name: Create ZIP
        shell: bash
        run: |
          cd package
          7z a "../Asteroids-${{ matrix.name }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asteroids-${{ matrix.name }}
          path: Asteroids-${{ matrix.name }}.zip
          if-no-files-found: error